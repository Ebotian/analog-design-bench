# The document set: what is rendered, from where, to where.
#
# Editable sources live in docs/src/.  Rendered outputs keep the historical
# paths so existing links and citations keep working.  ``generated_by`` marks a
# document produced by a dedicated script whose numbers come straight from
# results JSON; the rest are rendered from a tagged source by
# ``scripts/build_docs.py``.
#
# ``max_lines`` is a budget, not a target: when a document grows past it, the
# fix is to move history to git, not to raise the cap.

schema_version = "adb-docs-1"

[[doc]]
id = "plan"
title = "阶段计划"
source = "docs/src/plan.md"
output = "docs/PLAN.md"
tags = ["doc:plan", "kind:goal", "topic:roadmap"]
max_lines = 138

[[doc]]
id = "requirements"
title = "通用尺寸求解基建 — 需求规格"
source = "docs/src/requirements.md"
output = "docs/REQUIREMENTS.md"
tags = ["doc:requirements", "kind:scope", "topic:solver"]
max_lines = 245

[[doc]]
id = "readme"
title = "Analog Design Bench — 本地数据与求解基建"
source = "docs/src/readme.md"
output = "README.md"
tags = ["doc:readme", "kind:usage", "topic:corpus"]
max_lines = 182

[[doc]]
id = "data"
title = "数据卡：T0 语料"
source = "docs/src/data.md"
output = "DATA.md"
tags = ["doc:data", "kind:data", "topic:corpus"]
max_lines = 140

[[doc]]
id = "verifier"
title = "参考解官方判分实测"
output = "docs/VERIFIER_RESULTS.md"
generated_by = "scripts/build_results_md.py"
tags = ["doc:verifier", "kind:evidence", "topic:verifier"]
max_lines = 260
