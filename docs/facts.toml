# Facts used in prose.  A fact stores a *selector*, never a value.
#
#   kind = "json"  file + optional dotted path (int segments index lists)
#   kind = "toml"  file + optional dotted path
#   kind = "lines" file               count of non-empty lines
#   kind = "call"  call = "module:function", optional key into its dict
#
# Render-time extras: scale, format (str.format), truncate (string prefix),
# guard = false (opt out of the literal-number scan).
#
# Rule: if a measured number has no artifact to read it from, it does not go in
# a document.  Add the artifact first, then the fact.

schema_version = "adb-facts-1"

# ---------------------------------------------------------------- T0 corpus

[facts."corpus.tasks"]
kind = "json"
file = "data/leaderboard.json"
path = "stats.tasks"
format = "{:,}"

[facts."corpus.models"]
kind = "json"
file = "data/leaderboard.json"
path = "stats.models"
format = "{:,}"

[facts."corpus.runs"]
kind = "json"
file = "data/leaderboard.json"
path = "stats.rollouts"
format = "{:,}"

[facts."corpus.passes"]
kind = "json"
file = "data/leaderboard.json"
path = "stats.binaryPasses"
format = "{:,}"

[facts."corpus.files"]
kind = "json"
file = "manifests/t0.meta.json"
path = "files"
format = "{:,}"

[facts."corpus.size_mb"]
kind = "json"
file = "manifests/t0.meta.json"
path = "bytes"
scale = 1e-6
format = "{:.1f}"

# Data-quality counts live in the manifest, computed by scripts/check_t0.py.
[facts."corpus.no_gates"]
kind = "json"
file = "manifests/t0.meta.json"
path = "quality.runs_without_gates"
format = "{:,}"

[facts."corpus.no_gates_passed"]
kind = "json"
file = "manifests/t0.meta.json"
path = "quality.runs_without_gates_passed"

[facts."corpus.no_gates_median_min"]
