file = "manifests/t0.meta.json"
path = "quality.median_minutes_without_gates"
format = "{:.1f}"

[facts."corpus.reward_one"]
kind = "json"
file = "manifests/t0.meta.json"
path = "quality.reward_one_runs"
format = "{:,}"

# ---------------------------------------------------------------- T1 corpus

[facts."t1.commit"]
